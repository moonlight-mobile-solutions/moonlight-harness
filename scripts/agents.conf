# Where each agent reads user-level skills. Format: <name> <directory>
# `claude` and `agents` are the defaults. Codex, Gemini CLI and Cursor already read
# ~/.agents/skills, so enable their own directory only if your version doesn't.
claude   $HOME/.claude/skills
agents   $HOME/.agents/skills
gemini   $HOME/.gemini/skills
cursor   $HOME/.cursor/skills
copilot  $HOME/.copilot/skills
